name: zakat_app
description: Personal Zakat companion — calculate, track, and record your annual Zakat.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # Social auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0
  crypto: ^3.0.3

  # State management
  provider: ^6.1.1

  # HTTP
  http: ^1.2.0

  # Date / time / locale
  intl: ^0.19.0
  hijri: ^2.0.2

  # UI helpers
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10

  # Utilities
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
