name: zakat_app
description: Personal Zakat companion — calculate, track, and record your annual Zakat.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.14.0

  # Social auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0
  crypto: ^3.0.3

  # State management
  provider: ^6.1.1

  # HTTP
  http: ^1.2.0

  # Date / time / locale
  intl: ^0.19.0
  hijri: ^3.0.1

  # UI helpers
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10

  # Utilities
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  fake_cloud_firestore: ^2.5.2
  firebase_auth_mocks: ^0.13.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-700.ttf
          weight: 700
  assets:
    - assets/brand/icon.png
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/NotoSansArabic-OFL.txt
