name: Deploy web to Firebase

on:
  workflow_dispatch:
  push:
    branches: ['claude/zakat-app-build-0NR5K']
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firestore.rules'
      - 'scripts/monthly-reminders.cjs'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/claude/zakat-app-build-0NR5K'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAKAT_APP_36C58 }}
          project_id: zakat-app-36c58
      - name: Check backend access and reserve a free friendly URL
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_FROM: ${{ secrets.REMINDER_FROM }}
          REMINDER_SMTP_USER: ${{ secrets.REMINDER_SMTP_USER }}
          REMINDER_SMTP_APP_PASSWORD: ${{ secrets.REMINDER_SMTP_APP_PASSWORD }}
        run: node scripts/firebase-preflight.cjs
  deploy:
    if: github.ref == 'refs/heads/claude/zakat-app-build-0NR5K'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check deployment access is configured
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAKAT_APP_36C58 }}
        run: |
          if [ -z "$FIREBASE_CREDENTIALS" ]; then
            echo '::error::Add the FIREBASE_SERVICE_ACCOUNT_ZAKAT_APP_36C58 repository secret. See docs/firebase-deployment.md.'
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - run: npm ci
      - name: Authenticate to the existing Firebase project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAKAT_APP_36C58 }}
          project_id: zakat-app-36c58
      - name: Verify Google login is allowed on the friendly domain
        run: node scripts/check-hosting-domain.cjs
      - name: Deploy verified-account and monthly-giving database rules
        run: npx --no-install firebase deploy --project zakat-app-36c58 --only firestore:rules --non-interactive
      - name: Deploy to the existing live Hosting site
        run: npx --no-install firebase deploy --project zakat-app-36c58 --only hosting --non-interactive
      - name: Verify Hosting responds
        run: curl --fail --silent --show-error --retry 3 https://ztracker.web.app/ -o /dev/null
      - name: Record deployed version
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          echo 'Live site: https://ztracker.web.app (previous URL remains available)' >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $DEPLOYED_SHA" >> "$GITHUB_STEP_SUMMARY"
