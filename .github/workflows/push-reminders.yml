name: Web push giving reminders
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: ['claude/zakat-app-build-0NR5K', 'main']
    paths: ['scripts/push-reminders.cjs', '.github/workflows/push-reminders.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prepare/check push delivery without sending notifications'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: web-push-reminders
  cancel-in-progress: false
jobs:
  remind:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAKAT_APP_36C58 }}
          project_id: zakat-app-36c58
      - name: Check opted-in subscriptions and send daytime reminders
        env:
          DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/push-reminders.cjs --dry-run
          else
            node scripts/push-reminders.cjs
          fi
