name: Monthly progress sheet sharing
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check all email tasks without sending'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: monthly-progress-sheets
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Check email configuration
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_FROM: ${{ secrets.REMINDER_FROM }}
          REMINDER_SMTP_USER: ${{ secrets.REMINDER_SMTP_USER }}
          REMINDER_SMTP_APP_PASSWORD: ${{ secrets.REMINDER_SMTP_APP_PASSWORD }}
        run: |
          if { [ -z "$RESEND_API_KEY" ] || [ -z "$REMINDER_FROM" ]; } && { [ -z "$REMINDER_SMTP_USER" ] || [ -z "$REMINDER_SMTP_APP_PASSWORD" ]; }; then
            echo '::error::Configure Resend sender secrets or Gmail SMTP app-password secrets before enabling email reminders. In-app reminders remain available.'
            exit 1
          fi
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAKAT_APP_36C58 }}
          project_id: zakat-app-36c58
      - name: Deliver queued sheets, scheduled sharing and reminders
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_FROM: ${{ secrets.REMINDER_FROM }}
          REMINDER_SMTP_USER: ${{ secrets.REMINDER_SMTP_USER }}
          REMINDER_SMTP_APP_PASSWORD: ${{ secrets.REMINDER_SMTP_APP_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/email-delivery.cjs --dry-run
          else
            node scripts/email-delivery.cjs
          fi
