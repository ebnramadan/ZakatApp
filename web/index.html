<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Track your Zakat, monthly Sadaqah, and giving history in one private account.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Zakat Tracker">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/zakat-v2-apple.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html, body { margin:0; width:100%; height:100%; height:100dvh; overflow:hidden; position:fixed; background:#F4F6F5; overscroll-behavior:none; }
    #app-loading { position:fixed; inset:0; display:grid; place-items:center; background:#F4F6F5; z-index:10; }
    .loading-ring { width:22px; height:22px; border:2px solid #DDE5E1; border-top-color:#146356; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion:reduce) { .loading-ring { animation:none; } }
  </style>
  <title>Zakat Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="canonical" href="https://zakat-tracker.web.app/">
  <meta name="theme-color" content="#146356">
  <meta name="application-name" content="Zakat Tracker">
</head>
<body>
  <div id="app-loading" role="status" aria-label="Loading Zakat Tracker"><div class="loading-ring" aria-hidden="true"></div></div>
  <script>window.addEventListener("flutter-first-frame", function () { document.getElementById("app-loading")?.remove(); });</script>
  <noscript>Zakat Tracker needs JavaScript enabled to open your private account.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
