<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Track your Zakat, monthly Sadaqah, and giving history in one private account.">

  <!-- Static metadata lets messaging apps preview the link without running Flutter. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zakat Tracker">
  <meta property="og:title" content="Zakat Tracker — Give with intention">
  <meta property="og:description" content="Keep your Zakat clear, build a monthly Sadaqah habit, and follow your giving progress. Available in English and Arabic.">
  <meta property="og:url" content="https://ztracker.web.app/">
  <meta property="og:image" content="https://ztracker.web.app/sharing-logo-v4.png">
  <meta property="og:image:secure_url" content="https://ztracker.web.app/sharing-logo-v4.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="A sheikh offering a gift to someone in need, in cream and warm brown.">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ar_EG">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Zakat Tracker — Give with intention">
  <meta name="twitter:description" content="Track Zakat, monthly Sadaqah, and your giving progress in English or Arabic.">
  <meta name="twitter:image" content="https://ztracker.web.app/sharing-logo-v4.png">
  <meta name="twitter:image:alt" content="A sheikh offering a gift to someone in need.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Zakat Tracker">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/zakat-v4-apple.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon-v4.png"/>

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <style>
    html, body { margin:0; width:100%; height:100%; height:100dvh; overflow:hidden; position:fixed; background:#FBF5E9; overscroll-behavior:none; }
    #app-loading { position:fixed; inset:0; display:grid; place-items:center; background:#FBF5E9; z-index:10; }
    .giving-intro { width:min(300px,calc(100vw - 48px)); text-align:center; font:12px/1.4 system-ui,sans-serif; color:#146356; }
    .giving-intro svg { display:block; width:180px; height:160px; margin:0 auto 18px; animation:give-float 2.4s ease-in-out infinite; }
    .giving-heart { transform-origin:90px 75px; animation:give-heart 2.4s ease-in-out infinite; }
    .giving-intro strong { display:block; margin-bottom:8px; font-size:16px; font-weight:600; color:#146356; }
    .startup-progress { margin:18px 0 8px; width:100%; height:6px; accent-color:#146356; }
    #startup-percent { display:block; font-size:12px; margin-bottom:8px; }
    #startup-duaa { display:block; min-height:64px; white-space:pre-line; margin-top:18px; font-size:15px; line-height:1.6; color:#594333; }
    #startup-retry { margin-top:12px; min-height:44px; padding:8px 20px; border:1px solid #146356; border-radius:12px; color:#146356; background:#FFFCF7; font:inherit; cursor:pointer; }
    @keyframes give-float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }
    @keyframes give-heart { 0%,100% { transform:translateY(3px) scale(.96); opacity:.8; } 50% { transform:translateY(-3px) scale(1); opacity:1; } }
    @media (prefers-reduced-motion:reduce) { .giving-intro svg,.giving-heart { animation:none; } }
  </style>
  <title>Zakat Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="canonical" href="https://ztracker.web.app/">
  <meta name="theme-color" content="#146356">
  <meta name="application-name" content="Zakat Tracker">
</head>
<body>
  <div id="app-loading" role="status" aria-label="Preparing your space for giving">
    <div class="giving-intro">
      <svg viewBox="0 0 180 160" aria-hidden="true">
        <circle cx="90" cy="77" r="53" fill="#F1E3D1"/>
        <g fill="none" stroke="#146356" stroke-width="2" stroke-linecap="round" opacity=".45"><path d="M27 79h-5M35 50l-4-3M57 28l-2-5M90 21v-5M123 28l2-5M145 50l4-3M153 79h5"/></g>
        <path class="giving-heart" d="M90 94C80 84 60 72 60 58C60 40 81 37 90 52C99 37 120 40 120 58C120 72 100 84 90 94Z" fill="#146356"/>
        <path d="M24 114L41 101Q48 95 57 100L78 113Q90 120 102 113L123 100Q132 95 139 101L156 114L140 136Q90 160 40 136Z" fill="#E4C3A3" stroke="#146356" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M50 113L70 125Q90 137 110 125L130 113" fill="none" stroke="#146356" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <strong id="giving-title">Small acts. Lasting good.</strong>
      <span id="giving-caption">Downloading the app…</span>
      <progress id="startup-progress" class="startup-progress" max="4" value="0" aria-label="Startup steps completed"></progress>
      <span id="startup-percent">0% · 0 of 4 startup steps</span>
      <span id="startup-duaa">O Allah, accept our giving and bless what You have provided.

اللهم تقبّل منا وبارك لنا فيما رزقتنا.</span>
      <button id="startup-retry" hidden type="button" onclick="location.reload()">Try again</button>
    </div>
  </div>
  <script>
    (() => {
      let ar = false;
      try { ar = JSON.parse(localStorage.getItem('flutter.language') || 'null') === 'ar'; } catch (_) {}
      const box = document.getElementById('app-loading');
      const captions = ar
        ? ['بنحمّل التطبيق…', 'بنجهّز العرض…', 'بنوصل حسابك بأمان…', 'بنفتح حسابك…', 'جاهز']
        : ['Downloading the app…', 'Preparing the display…', 'Connecting securely…', 'Opening your account…', 'Ready'];
      const arabicDuaas = [
        'اللهم تقبّل منا وبارك لنا فيما رزقتنا.',
        'اللهم ارزقنا قلبًا رحيمًا ويسّر لنا أبواب الخير.',
        'اللهم اجعل عطاءنا خالصًا لوجهك، وبارك لمن نعطيهم.'
      ];
      const englishDuaas = [
        'O Allah, accept our giving and bless what You have provided.',
        'O Allah, grant us a compassionate heart and open the doors of goodness.',
        'O Allah, make our giving sincerely for You, and bless those we give to.'
      ];
      const duaas = ar ? arabicDuaas : englishDuaas.map((text, index) => `${text}\n\n${arabicDuaas[index]}`);
      if (ar) { box.dir = 'rtl'; box.setAttribute('aria-label', 'بنجهّزلك مساحة للخير'); document.getElementById('giving-title').textContent = 'خير بسيط، وأثره كبير.'; }
      let completed = 0, duaa = 0;
      function render() {
        const caption = document.getElementById('giving-caption');
        if (!caption) return;
        caption.textContent = captions[completed];
        document.getElementById('startup-progress').value = completed;
        document.getElementById('startup-percent').textContent = ar
          ? `${(completed * 25).toLocaleString('ar-EG')}٪ · خلّصنا ${completed.toLocaleString('ar-EG')} من ٤ خطوات`
          : `${completed * 25}% · ${completed} of 4 startup steps`;
        document.getElementById('startup-duaa').textContent = duaas[duaa];
      }
      window.zakatStartup = {
        complete(stage) { completed = Math.max(completed, Math.min(4, stage)); render(); },
        fail() { const button = document.getElementById('startup-retry'); if (button) { button.hidden = false; button.textContent = ar ? 'جرّب تاني' : 'Try again'; } }
      };
      render();
      const rotate = setInterval(() => { duaa = (duaa + 1) % duaas.length; render(); }, 5000);
      const slow = setTimeout(() => window.zakatStartup.fail(), 15000);
      window.addEventListener('flutter-first-frame', () => { clearInterval(rotate); clearTimeout(slow); box.remove(); }, {once: true});
    })();
  </script>
  <noscript>Zakat Tracker needs JavaScript enabled to open your private account.</noscript>
  <script>
    // Fetch a fresh loader online: an old Flutter cache must not pin an old app version.
    const bootstrap = document.createElement('script');
    bootstrap.src = 'flutter_bootstrap.js?release=' + Date.now();
    bootstrap.async = true;
    bootstrap.onerror = () => {
      const offline = document.createElement('script');
      offline.src = 'flutter_bootstrap.js';
      document.body.appendChild(offline);
    };
    document.body.appendChild(bootstrap);
  </script>
</body>
</html>
